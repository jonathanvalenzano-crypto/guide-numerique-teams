  view: "home",
  visited: [],
  railActive: null, railVisited: [],
  openTeam: "3eA", channel: "3eA/Général", hidden: ["3eA/Sortie au musée"], showHidden: {},
  calSelected: null,
  messages: [
    { who: "Mme Dupont", role: "Prof", text: "Bonjour à toutes et à tous ! Bienvenue dans le canal Général de la classe. 🎉" },

  ],
  msgText: "", msgFile: null,
  opened: null, rendu: false, rep: null, formsEnvoye: false,
  joined: false, mic: false, cam: false,
  answers: {}
};

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function bubble(inner, tone) {
  return '<div class="bubble' + (tone === "green" ? " bubble-green" : "") + '">' + inner + "</div>";
}

// ---------- Actions ----------
function goHome() { state.view = "home"; render(); }
function openView(id) {
  state.view = id;
  if (state.visited.indexOf(id) < 0) state.visited.push(id);
  render();
}
function railClick(id) {
  state.railActive = id;
  if (state.railVisited.indexOf(id) < 0) state.railVisited.push(id);
  render();
}
function toggleTeam(id) { state.openTeam = state.openTeam === id ? null : id; render(); }
function pickChannel(k) { state.channel = k; render(); }
function hideChannel(k) { if (state.hidden.indexOf(k) < 0) state.hidden.push(k); if (state.channel === k) state.channel = null; render(); }
function showChannel(k) { state.hidden = state.hidden.filter(function (x) { return x !== k; }); render(); }
function toggleHiddenList(id) { state.showHidden[id] = !state.showHidden[id]; render(); }
function calSelect(i) { state.calSelected = i; render(); }
function attachMsgFile() { if (!state.msgFile) state.msgFile = "photo-exercice-fractions.jpg"; render(); }
function removeMsgFile() { state.msgFile = null; render(); }
function sendMsg() {
  var t = state.msgText.trim();
  if (!t && !state.msgFile) return;
  state.messages.push({ who: "Toi", role: "Élève", text: t, file: state.msgFile });
  state.msgText = ""; state.msgFile = null;
  render();
}
function openDevoir(id) { state.opened = id; render(); }
function remettre() { state.rendu = true; render(); }
function pickRep(i) { state.rep = i; render(); }
function sendForms() { if (state.rep !== null) state.formsEnvoye = true; render(); }
function joinVisio() { state.joined = true; render(); }
function toggleMic() { state.mic = !state.mic; render(); }
function toggleCam() { state.cam = !state.cam; render(); }
function answer(qi, oi) { if (state.answers[qi] === undefined) { state.answers[qi] = oi; render(); } }
function resetQuiz() { state.answers = {}; render(); }

// ---------- Visuels ----------
function railIcons(interactive) {
  return railItems.map(function (it) {
    var cls = "rail-item";
    if (interactive) {
      if (state.railActive === it.id) cls += " rail-active";
    } else {
      cls += it.id === "chat" ? " rail-active" : " rail-dim";
    }
    return '<button class="' + cls + '" ' + (interactive ? 'onclick="railClick(\'' + it.id + '\')"' : "") + ">" +
      (interactive && state.railVisited.indexOf(it.id) >= 0 ? '<span class="rail-check">✅</span>' : "") +
      (!interactive && it.id === "chat" ? '<span class="here">Tu es ici</span>' : "") +
      '<span class="ri-e">' + it.emoji + '</span><span class="ri-l">' + it.label + "</span></button>";
  }).join("");
}

function equipesVisual() {
  var missionDone = state.hidden.indexOf("3eA/Sortie au musée") < 0;

            (state.showHidden[eq.id]

    (missionDone

      : '<div class="mission">🕵️ <b>Mission :</b> le canal <b>« Sortie au musée »</b> de la Classe de 3e A a été masqué ! Retrouve-le et fais-le réapparaître. <b>Indice :</b> déplie la Classe de 3e A, puis regarde en bas de ses canaux… 👁</div>') +
    '<div class="teams-list">' + teams + "</div>" +

}

function calendrierVisual() {
  var cellH = 30, hDebut = 8, hFin = 18, rows = "", h;
  for (h = hDebut; h <= hFin; h++) {
    rows += '<div class="cal-row"><div class="cal-hour">' + h + "h</div>" +
      calJours.map(function () { return '<div class="cal-cell"></div>'; }).join("") + "</div>";
  }
  var blocks = calEvents.map(function (ev, i) {
    var top = (ev.debut - hDebut) * cellH, height = (ev.fin - ev.debut) * cellH;
    return '<button class="cal-event" style="top:' + top + "px;height:" + height + "px;left:calc(44px + (100% - 44px) / 5 * " + ev.jour + ');width:calc((100% - 44px) / 5)" onclick="calSelect(' + i + ')">' +
      '<span class="ce-t">' + ev.emoji + " " + ev.titre + '</span><span class="ce-h">' + ev.debut + "h – " + ev.fin + "h</span></button>";
  }).join("");
  var sel = state.calSelected !== null ? calEvents[state.calSelected] : null;
  return '<div class="panel">' +
    '<div class="cal-toolbar">' +
    '<button class="cal-btn">Aujourd\'hui</button><button class="cal-btn">‹</button><button class="cal-btn">›</button>' +
    '<span class="cal-period">28 septembre – 2 octobre 2026</span><button class="cal-btn">▾ Semaine</button><span class="cal-spacer"></span>' +
    '<span class="cal-btn">🔎 Rechercher</span><span class="cal-btn">📹 Réunion instantanée</span><button class="cal-btn-new">+ Nouvelle réunion</button></div>' +
    '<div style="overflow-x:auto"><div style="min-width:430px">' +
    '<div class="cal-heads"><div></div>' +
    calJours.map(function (j) {
      return '<div class="cal-day' + (j.today ? " today" : "") + '">' + j.nom + " " + j.date + (j.today ? ' <span class="today-tag">• aujourd\'hui</span>' : "") + "</div>";
    }).join("") + "</div>" +
    '<div class="cal-grid">' + rows + blocks + "</div></div></div>" +
    (sel ? '<div class="cal-detail"><b style="color:' + TEAMS + '">' + sel.emoji + " " + sel.titre + "</b> — de " + sel.debut + "h à " + sel.fin + "h, en ligne. Dans le vrai Teams, clique sur l'événement puis sur <b>Rejoindre</b> pour entrer dans la réunion — c'est ce que tu as appris dans la rubrique 4 ! 👉</div>" : "") +
    '<div class="panel-note">💡 Le calendrier affiche tous tes rendez-vous : chaque bloc coloré est une réunion (un cours en visio, une réunion de groupe…). Clique sur les blocs pour voir les détails ! Les flèches « ‹ › » permettent de changer de semaine et « Aujourd\'hui » de revenir à la date du jour.</div></div>';
}

  }

  return '<div class="wrap">' +
    chapterWrap(3, "Rendre un devoir",
      "<p class=\"lead\">Voici l'application « Devoirs » du vrai Teams. Attention : un devoir n'est pas toujours un fichier à rendre ! Ça peut être un <b>fichier</b>, mais aussi un <b>quiz Microsoft Forms</b> ou un <b>exercice BookWidget</b> à compléter directement. Essaie les deux devoirs de cette semaine 👇</p>" +
      '<div class="window"><div class="purple-bar">📝 Devoirs</div>' + (state.opened ? detail : list) + "</div>") +
    backHomeBar() + "</div>";
}

function renderVisio() {
  var inner;
  if (!state.joined) {
    inner = '<div style="padding:14px"><button class="btn-primary btn-green btn-big" style="background:' + GREEN + '" onclick="joinVisio()">▶ Rejoindre la réunion</button></div>';
  } else {
    inner = '<div style="padding:14px">' +
      '<div class="visio-screen">' + (state.cam ? "📹 Ta caméra est allumée (imagine ton visage ici 😊)" : "📷 Caméra coupée — tu vois le cours, on ne te voit pas") + "</div>" +
      '<div class="visio-controls">' +
      '<button class="pill ' + (state.mic ? "mic-on" : "off") + '" onclick="toggleMic()">' + (state.mic ? "🎙️ Micro activé" : "🔇 Micro coupé") + "</button>" +
      '<button class="pill ' + (state.cam ? "cam-on" : "off") + '" onclick="toggleCam()">' + (state.cam ? "📹 Caméra allumée" : "📷 Caméra coupée") + "</button>" +
      '<button class="pill leave">⏻ Quitter</button></div>' +
      '<div style="margin-top:12px">' +
      bubble("🎯 Règles de politesse : on coupe son micro quand on ne parle pas, et on lève la « main ✋ » (bouton Réactions) pour demander la parole.") +
      "</div></div>";
  }
  return '<div class="wrap">' +
    chapterWrap(4, "Rejoindre un cours en visio",
      "<p class=\"lead\">Réunion ne veut pas dire complication : un clic pour rejoindre, deux boutons à connaître — le micro et la caméra. Essaie les deux !</p>" +
      '<div class="window"><div class="purple-bar">📅 Calendrier — Mercredi 14h00 : Cours de maths en ligne</div>' + inner + "</div>") +
    backHomeBar() + "</div>";
}

function renderQuiz() {
  var cards = quiz.map(function (q, qi) {
    var answered = state.answers[qi] !== undefined;
    var opts = q.options.map(function (opt, oi) {
      var cls = "quiz-opt";
      if (answered) {
        if (oi === q.answer) cls += " correct";
        else if (state.answers[qi] === oi) cls += " wrong";
      }
      return '<button class="' + cls + '"' + (answered ? " disabled" : ' onclick="answer(' + qi + "," + oi + ')"') + ">" +
        (answered && oi === q.answer ? "✅ " : answered && state.answers[qi] === oi ? "❌ " : "") + opt + "</button>";
    }).join("");
    return '<div class="quiz-card"><p class="quiz-q">' + (qi + 1) + ". " + q.q + "</p>" + opts +
      (answered ? '<div class="quiz-expl">💡 ' + q.explain + "</div>" : "") + "</div>";
  }).join("");
  var done = Object.keys(state.answers).length === quiz.length;
  var score = quiz.reduce(function (acc, q, i) { return acc + (state.answers[i] === q.answer ? 1 : 0); }, 0);
  var scoreHtml = done
    ? '<div class="quiz-score"><h3>' + (score >= 4 ? "🏆 Excellent !" : score >= 3 ? "👍 Bien joué !" : "💪 Presque !") + "</h3>" +
      "<p>Score : " + score + "/" + quiz.length + " — " + (score >= 3 ? "Tu es officiellement prêt(e) à utiliser Teams avec ta classe !" : "Reviens sur les rubriques qui t'ont posé question 😉") + "</p></div>"
    : "";
  return '<div class="wrap">' +
    chapterWrap(5, "Quiz final : es-tu prêt(e) pour Teams ?",
      "<p class=\"lead\">Réponds aux 5 questions. Tu vois immédiatement si c'est juste, avec une explication. Tu peux recommencer autant de fois que tu veux !</p>" +
      cards + scoreHtml) +
    backHomeBar(done ? '<button class="link-reset" onclick="resetQuiz()">🔁 Refaire le quiz</button>' : "") +
    "</div>";
}

// ---------- Rendu principal ----------
function render() {
  var app = document.getElementById("app");
  var header = '<div class="header"><div class="logo">🧑‍🏫</div><div class="ht"><b>Mission Teams</b><span>Apprends Microsoft Teams pas à pas — spécial grands débutants</span></div>' +
    (state.view !== "home" ? '<button class="btn-home-top" onclick="goHome()">⌂ Accueil</button>' : "") + "</div>";
  var body = "";
  if (state.view === "home") body = renderHome();
  else if (state.view === "interface") body = renderInterface();
  else if (state.view === "message") body = renderMessage();
  else if (state.view === "devoirs") body = renderDevoirs();
  else if (state.view === "visio") body = renderVisio();
  else if (state.view === "quiz") body = renderQuiz();
  app.innerHTML = header + body;
}
render();
</script>
</body>
</html>
